name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string
      experimental:
        description: "Mark as experimental/prerelease"
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_ROLL_FORWARD: Major

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "ga"

      - name: Install CryptoMiniSat build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git python3 pkg-config patchelf \
            libgmp-dev zlib1g-dev squashfs-tools

      - name: Build CryptoMiniSat with benchmarked dependency revisions
        run: |
          python3 - <<'PYTHON'
          import json, shutil
          from pathlib import Path
          versions = json.loads(Path('native/versions.json').read_text())
          source = Path('native/build/source')
          shutil.copytree('native/cryptominisat', source, dirs_exist_ok=True,
                          ignore=shutil.ignore_patterns('.git', 'build'))
          cmake = source / 'CMakeLists.txt'
          pins = ['include(FetchContent)']
          for name in ('cadical', 'cadiback'):
              pins.append(f'FetchContent_Declare({name} GIT_REPOSITORY https://github.com/meelgroup/{name} GIT_TAG {versions[name]} GIT_SHALLOW FALSE)')
          content = cmake.read_text()
          assert content.count('include(FetchContent)') == 1
          cmake.write_text(content.replace('include(FetchContent)', '\n'.join(pins)))
          implementation = source / 'src/cryptominisat.cpp'
          content = implementation.read_text().replace('#include "cadical_gitsha1.hpp"', '')
          for name, namespace in (('cadical', 'CaDiCaL'), ('cadiback', 'CadiBack')):
              accessor = f'return {namespace}::get_version_sha1();'
              assert accessor in content
              content = content.replace(accessor, f'return "{versions[name]}";')
          implementation.write_text(content)
          template = source / 'src/GitSHA1.cpp.in'
          template.write_text(template.read_text().replace('@GIT_SHA1@', versions['cryptominisat']))
          PYTHON
          cmake -S native/build/source -B native/build/cms -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DENABLE_TESTING=OFF -DSTATS=OFF -DNOBREAKID=ON \
            -DBUILD_PYTHON_EXTENSION=OFF
          cmake --build native/build/cms --target cryptominisat5 --parallel 4

      - name: Copy CMS shared library and dependencies to runtimes
        run: |
          DEST="src/ApsGenerator.Solver/runtimes/linux-x64/native"
          BUILD_ROOT=$(realpath native/build/cms)
          CMS_LIBRARY="$BUILD_ROOT/lib/libcryptominisat5.so"
          mkdir -p "$DEST"
          find "$DEST" -maxdepth 1 -type f -name '*.so*' -delete
          cp -L "$CMS_LIBRARY" "$DEST/libcryptominisat5.so"
          # Refresh both GMP files even when CMS does not import them directly;
          # the mod bootstrap loads them and the source notice must match them.
          for soname in libgmp.so.10 libgmpxx.so.4; do
            dependency_path=$(ldconfig -p | awk -v name="$soname" '$1 == name && !found { print $NF; found=1 }')
            cp -L "$dependency_path" "$DEST/$soname"
          done

          # CryptoMiniSat's fetched CaDiCaL/CaDiBaCk revisions may build either
          # static or shared libraries. Recursively package any shared build
          # dependencies, plus GMP, rather than relying on a fixed dependency list.
          pending=("$CMS_LIBRARY")
          declare -A inspected=()
          while ((${#pending[@]})); do
            binary=${pending[0]}
            pending=("${pending[@]:1}")
            binary=$(realpath "$binary")
            if [[ -n "${inspected[$binary]:-}" ]]; then
              continue
            fi
            inspected[$binary]=1

            while read -r soname dependency_path; do
              if [[ "$dependency_path" == "not" ]]; then
                echo "Unable to resolve $soname required by $binary." >&2
                exit 1
              fi

              dependency_path=$(realpath "$dependency_path")
              case "$dependency_path" in
                "$BUILD_ROOT"/*|*/libgmp.so.*|*/libgmpxx.so.*)
                  destination="$DEST/$soname"
                  if [[ ! -e "$destination" ]]; then
                    cp -L "$dependency_path" "$destination"
                    echo "Copied dependency: $soname"
                  fi
                  pending+=("$dependency_path")
                  ;;
              esac
            done < <(ldd "$binary" | awk '/=>/ { print $1, $3 }')
          done

          # The dynamic loader does not search the directory of a dependent
          # library by default. Make every packaged library resolve siblings.
          find "$DEST" -maxdepth 1 -type f -name '*.so*' \
            -exec patchelf --set-rpath '$ORIGIN' {} \;

          source_version=$(dpkg-query -W -f='${source:Version}' libgmp-dev)
          {
            echo "GNU MP corresponding source"
            echo "==========================="
            echo
            echo "These release binaries came from Ubuntu source package gmp $source_version."
            echo "Corresponding source, including Ubuntu packaging changes, is available at:"
            echo
            echo "https://launchpad.net/ubuntu/+source/gmp/$source_version"
          } > LICENSES/GMP-SOURCE.txt
          ls -la "$DEST"

      - name: Run tests
        run: |
          for project in tests/ApsGenerator.Core.Tests tests/ApsGenerator.Solver.Tests tests/ApsGenerator.UI.Tests; do
            timeout 600 dotnet test "$project" -c Release -m:1 /nodeReuse:false -p:UseSharedCompilation=false \
              --filter 'Category!=DataCollection&Category!=Benchmark&Category!=RegressionBenchmark&Category!=Slow'
          done

      - name: Publish
        run: >
          dotnet publish src/ApsGenerator.UI/ApsGenerator.UI.csproj -c Release -r linux-x64 --self-contained -p:Version=${{ inputs.version }}

      - name: Verify packaged Linux native dependencies
        run: |
          NATIVE_DIR="src/ApsGenerator.Solver/runtimes/linux-x64/native"
          PUBLISH_DIR="src/ApsGenerator.UI/bin/Release/net10.0/linux-x64/publish"
          for source_library in "$NATIVE_DIR"/*.so*; do
            library="$PUBLISH_DIR/$(basename "$source_library")"
            if [[ ! -f "$library" ]]; then
              echo "Missing published native library: $(basename "$library")" >&2
              exit 1
            fi

            cmp "$source_library" "$library"
            echo "Checking $(basename "$library")"
            dependency_report=$(ldd "$library")
            echo "$dependency_report"
            if grep -q 'not found' <<< "$dependency_report"; then
              exit 1
            fi
          done

      - name: Install vpk
        run: dotnet tool install -g vpk --version 0.0.1298

      - name: Package
        run: >
          vpk pack --packId APS-Generator --packVersion ${{ inputs.version }} --packDir src/ApsGenerator.UI/bin/Release/net10.0/linux-x64/publish --mainExe ApsGenerator.UI --releaseNotes release-notes.md --outputDir releases


      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: releases/

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "ga"

      # --- CryptoMiniSat Windows build (MSYS2/MinGW) ---
      - name: Setup MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja make mingw-w64-x86_64-gmp mingw-w64-x86_64-zlib mingw-w64-x86_64-pkgconf mingw-w64-x86_64-python


      - name: Build CryptoMiniSat with benchmarked dependency revisions
        shell: msys2 {0}
        run: |
          python - <<'PYTHON'
          import json, shutil
          from pathlib import Path
          versions = json.loads(Path('native/versions.json').read_text())
          source = Path('native/build/source')
          shutil.copytree('native/cryptominisat', source, dirs_exist_ok=True,
                          ignore=shutil.ignore_patterns('.git', 'build'))
          cmake = source / 'CMakeLists.txt'
          pins = ['include(FetchContent)']
          for name in ('cadical', 'cadiback'):
              pins.append(f'FetchContent_Declare({name} GIT_REPOSITORY https://github.com/meelgroup/{name} GIT_TAG {versions[name]} GIT_SHALLOW FALSE)')
          content = cmake.read_text()
          assert content.count('include(FetchContent)') == 1
          cmake.write_text(content.replace('include(FetchContent)', '\n'.join(pins)))
          implementation = source / 'src/cryptominisat.cpp'
          content = implementation.read_text().replace('#include "cadical_gitsha1.hpp"', '')
          for name, namespace in (('cadical', 'CaDiCaL'), ('cadiback', 'CadiBack')):
              accessor = f'return {namespace}::get_version_sha1();'
              assert accessor in content
              content = content.replace(accessor, f'return "{versions[name]}";')
          implementation.write_text(content)
          template = source / 'src/GitSHA1.cpp.in'
          template.write_text(template.read_text().replace('@GIT_SHA1@', versions['cryptominisat']))
          PYTHON
          cmake -S native/build/source -B native/build/cms -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DENABLE_TESTING=OFF -DSTATS=OFF -DNOBREAKID=ON \
            -DBUILD_PYTHON_EXTENSION=OFF \
            -DCMAKE_SHARED_LINKER_FLAGS="-static-libgcc -static-libstdc++"
          cmake --build native/build/cms --target cryptominisat5 --parallel 4

      - name: Copy CMS DLL and dependencies to runtimes
        shell: msys2 {0}
        run: |
          DEST="src/ApsGenerator.Solver/runtimes/win-x64/native"
          mkdir -p "$DEST"
          find "$DEST" -maxdepth 1 -type f -name '*.dll' -delete
          DLL="native/build/cms/cmsat5-src/libcryptominisat5win.dll"
          cp "$DLL" "$DEST/cryptominisat5.dll"
          # Recursively package non-system DLLs from the build and MinGW runtime.
          pending=("$DEST/cryptominisat5.dll")
          while ((${#pending[@]})); do
            binary=${pending[0]}
            pending=("${pending[@]:1}")
            while read -r dependency; do
              dependency_path=$(find native/build/cms /mingw64/bin \
                -type f -iname "$dependency" -print -quit)
              if [[ -z "$dependency_path" ]]; then
                case "${dependency,,}" in
                  kernel32.dll|msvcrt.dll)
                    continue
                    ;;
                  *)
                    echo "Unable to package $dependency required by $(basename "$binary")." >&2
                    exit 1
                    ;;
                esac
              fi
              destination="$DEST/$(basename "$dependency_path")"
              if [[ -e "$destination" ]]; then
                continue
              fi
              cp "$dependency_path" "$destination"
              pending+=("$destination")
              echo "Copied dependency: $(basename "$dependency_path")"
            done < <(objdump -p "$binary" | awk '/DLL Name:/ { print $3 }')
          done
          if ldd "$DLL" | grep -qi 'libgmp'; then
            package_version=$(pacman -Q mingw-w64-x86_64-gmp | awk '{print $2}')
            {
              echo "GNU MP corresponding source"
              echo "==========================="
              echo
              echo "These release binaries came from MSYS2 package mingw-w64-x86_64-gmp $package_version."
              echo "The package recipe and corresponding source links are available at:"
              echo
              echo "https://packages.msys2.org/packages/mingw-w64-x86_64-gmp"
            } > LICENSES/GMP-SOURCE.txt
          fi
          echo "Contents of $DEST:"
          ls -la "$DEST"

      - name: Run tests
        shell: pwsh
        run: |
          $nativeDir = Join-Path $env:GITHUB_WORKSPACE 'src/ApsGenerator.Solver/runtimes/win-x64/native'
          $env:PATH = "$nativeDir;$env:PATH"
          foreach ($project in @('tests/ApsGenerator.Core.Tests', 'tests/ApsGenerator.Solver.Tests', 'tests/ApsGenerator.UI.Tests')) {
            dotnet test $project -c Release -m:1 /nodeReuse:false -p:UseSharedCompilation=false --filter 'Category!=DataCollection&Category!=Benchmark&Category!=RegressionBenchmark&Category!=Slow'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish
        run: >
          dotnet publish src/ApsGenerator.UI/ApsGenerator.UI.csproj -c Release -r win-x64 --self-contained -p:Version=${{ inputs.version }}


      - name: Verify packaged Windows native dependencies
        shell: pwsh
        run: |
          $nativeDir = 'src/ApsGenerator.Solver/runtimes/win-x64/native'
          $publishDir = 'src/ApsGenerator.UI/bin/Release/net10.0/win-x64/publish'
          foreach ($source in Get-ChildItem "$nativeDir/*.dll") {
            $packaged = Join-Path $publishDir $source.Name
            if (!(Test-Path $packaged) -or (Get-FileHash $source.FullName).Hash -ne (Get-FileHash $packaged).Hash) {
              throw "Missing or mismatched published native library: $($source.Name)"
            }
          }

      - name: Install vpk
        run: dotnet tool install -g vpk --version 0.0.1298

      - name: Package
        run: >
          vpk pack --packId APS-Generator --packVersion ${{ inputs.version }} --packDir src/ApsGenerator.UI/bin/Release/net10.0/win-x64/publish --mainExe ApsGenerator.UI.exe --releaseNotes release-notes.md --outputDir releases


      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: releases/

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "ga"

      - name: Install vpk
        run: dotnet tool install -g vpk --version 0.0.1298

      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: releases/linux

      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: releases/windows

      - name: Upload Linux Release
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --outputDir releases/linux --channel linux --tag v${{ inputs.version }} --releaseName "APS Generator v${{ inputs.version }}${{ inputs.experimental && ' (Experimental)' || '' }}" --publish ${{ inputs.experimental && '--pre' || '' }} --token ${{ secrets.GITHUB_TOKEN }}


      - name: Upload Windows Release
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --outputDir releases/windows --channel win --tag v${{ inputs.version }} --releaseName "APS Generator v${{ inputs.version }}${{ inputs.experimental && ' (Experimental)' || '' }}" --publish --merge ${{ inputs.experimental && '--pre' || '' }} --token ${{ secrets.GITHUB_TOKEN }}


      - name: Set release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ inputs.version }}" --notes-file release-notes.md
